<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Infinite Express · Manual Record</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#ffd27a;--ink:#f2ead8;--muted:#9a9484;--line:rgba(255,210,120,.28)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#07090e;color:var(--ink);font:14px/1.4 Manrope,system-ui,sans-serif;overflow:hidden}
body{display:grid;grid-template-rows:1fr auto;min-height:100%}
#stageWrap{display:grid;place-items:center;min-height:0;padding:16px}
#stage{
  position:relative;width:min(46vh,380px);aspect-ratio:9/16;background:#000;
  border:1px solid var(--line);box-shadow:0 20px 70px rgba(0,0,0,.55);overflow:hidden;border-radius:4px;
  cursor:crosshair;touch-action:none;
}
#stage:focus{outline:2px solid rgba(255,210,120,.45);outline-offset:3px}
#comp,#gl{display:block;width:100%;height:100%;object-fit:contain;background:#000}
#gl{position:absolute;left:-9999px;width:1080px;height:1920px;pointer-events:none}
#hud{
  position:absolute;left:10px;right:10px;bottom:10px;z-index:2;pointer-events:none;
  font:600 11px/1.35 Manrope,system-ui,sans-serif;color:rgba(242,234,216,.88);
  text-shadow:0 1px 3px rgba(0,0,0,.7);display:flex;justify-content:space-between;gap:8px;align-items:flex-end;
}
#hud b{color:var(--gold);font-weight:700}
#recDot{display:none;align-items:center;gap:6px;color:#ff8a8a}
#recDot.on{display:inline-flex}
#recDot i{width:8px;height:8px;border-radius:50%;background:#e33;box-shadow:0 0 8px #e33;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}
#bar{
  border-top:1px solid rgba(255,210,120,.14);background:rgba(10,12,18,.96);
  padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.keys{color:var(--muted);font-size:12px}
.keys kbd{
  display:inline-block;min-width:1.5em;padding:2px 6px;margin:0 1px;border:1px solid rgba(255,210,120,.28);
  border-radius:5px;background:#161b2a;color:var(--gold);font:700 11px/1.4 ui-monospace,Consolas,monospace;text-align:center;
}
button,a.btn{
  appearance:none;border:1px solid rgba(255,210,120,.35);background:#1a2034;color:var(--ink);
  border-radius:10px;padding:10px 14px;min-height:42px;font:600 13px/1 Manrope;cursor:pointer;
  text-decoration:none;display:inline-flex;align-items:center;gap:8px;
}
button:hover,a.btn:hover{background:#243052}
button:disabled{opacity:.4;cursor:default}
button.rec{background:linear-gradient(180deg,#7a2430,#4e1520);border-color:rgba(255,120,120,.45);color:#ffd0d0}
button.rec.on{box-shadow:0 0 0 2px rgba(220,60,70,.35)}
a.btn.primary{background:linear-gradient(180deg,#3a4578,#2a335c);border-color:rgba(255,210,120,.55);color:var(--gold)}
#dl{display:none}#dl.show{display:inline-flex}
.status{color:var(--muted);font-size:12px;min-width:8ch}
label.toggle{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;user-select:none}
label.toggle input{accent-color:var(--gold)}
</style>
</head>
<body>
<div id="stageWrap">
  <div id="stage" tabindex="0" title="Click to focus · drag to look">
    <canvas id="gl" width="1080" height="1920" aria-hidden="true"></canvas>
    <canvas id="comp" width="1080" height="1920" aria-label="Record preview"></canvas>
    <div id="hud">
      <div><b>WASD</b> move · <b>QE</b> up/down · <b>drag</b> look</div>
      <div id="recDot"><i></i><span id="recTime">0:00</span></div>
    </div>
  </div>
</div>

<section id="bar">
  <div class="keys">
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move
    · <kbd>Q</kbd><kbd>E</kbd> up/down
    · mouse drag look
  </div>
  <div class="controls">
    <span class="status" id="stateLabel">Ready</span>
    <label class="toggle"><input id="withVo" type="checkbox"> Mix voiceover</label>
    <button id="btnReset" type="button">Reset cam</button>
    <button id="btnRec" class="rec" type="button">⏺ Record</button>
    <button id="btnStop" type="button" disabled>Stop</button>
    <a id="dl" class="btn primary" download="infinite-express-manual.webm">⬇ Download</a>
  </div>
</section>

<audio id="vo" src="assets/audio/infinite-express-voiceover.mp3?v=drew-v4" preload="auto" crossorigin="anonymous"></audio>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';

const VW = 1080, VH = 1920;
const COACHES = 10, SPC = 10, BAYS = 5, TOTAL = COACHES * SPC, CLEN = 10, ENGINE_X = 11;
const cxp = c => -c * CLEN;
const cl = (v, a, b) => Math.max(a, Math.min(b, v));

const glCanvas = document.getElementById('gl');
const comp = document.getElementById('comp');
const ctx = comp.getContext('2d');
const stage = document.getElementById('stage');
const vo = document.getElementById('vo');
const stateLabel = document.getElementById('stateLabel');
const recDot = document.getElementById('recDot');
const recTimeEl = document.getElementById('recTime');
const dl = document.getElementById('dl');
const withVo = document.getElementById('withVo');

/* ---------- Scene (same train language as the station build) ---------- */
const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true, alpha: false, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
renderer.setSize(VW, VH, false);
renderer.setPixelRatio(1);
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(46, VW / VH, 0.35, 2600);
const sky = new THREE.Color('#8ecdf5');
scene.background = sky;
scene.fog = new THREE.Fog(sky, 55, 180);
const hemi = new THREE.HemisphereLight(0xffffff, 0x6a9a5a, 0.9);
const sun = new THREE.DirectionalLight(0xfff0d8, 1.15);
sun.position.set(-40, 90, 50);
scene.add(hemi, sun);
const head = new THREE.PointLight(0xffe6a0, 0.55, 45);
head.position.set(ENGINE_X + 5.3, 3.55, 0);
scene.add(head);

const L = o => new THREE.MeshLambertMaterial(o);
const box = (x, y, z) => new THREE.BoxGeometry(x, y, z);
const flat = g => { g = g.toNonIndexed(); g.computeVertexNormals(); return g; };
const rng = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const M = new THREE.Object3D(), Col = new THREE.Color();
function inst(geo, mat, n, fn) {
  const m = new THREE.InstancedMesh(geo, mat, n);
  for (let i = 0; i < n; i++) {
    M.position.set(0, 0, 0); M.rotation.set(0, 0, 0); M.scale.set(1, 1, 1);
    fn(i, M, Col); M.updateMatrix(); m.setMatrixAt(i, M.matrix); m.setColorAt(i, Col);
  }
  m.frustumCulled = false; return m;
}

const world = new THREE.Group(); scene.add(world);
(() => {
  const add = (geo, col, x, y, z, parent = world, rx, ry, rz) => {
    const m = new THREE.Mesh(geo, L({ color: col }));
    m.position.set(x, y, z); if (rx) m.rotation.x = rx; if (ry) m.rotation.y = ry; if (rz) m.rotation.z = rz;
    parent.add(m); return m;
  };
  const r = rng(21);
  const LEAF = ['#1b5e2a', '#246b32', '#2f7a38', '#185024', '#3a8a42', '#207038'];
  const addTree = (x, z, kind) => {
    const s = .75 + r() * 1.1;
    add(new THREE.CylinderGeometry(.2 + r() * .1, .28, .9 + s * .4, 5), '#5a3a22', x, .55 + s * .15, z);
    if (kind === 0) {
      const leaf = new THREE.Mesh(flat(new THREE.IcosahedronGeometry(1.35, 0)), L({ color: LEAF[(x * 10 | 0) % LEAF.length], emissive: '#0d2814', emissiveIntensity: .22 }));
      leaf.position.set(x, 1.55 + s * .5, z); leaf.scale.setScalar(s); world.add(leaf);
    } else {
      const leaf = new THREE.Mesh(flat(new THREE.ConeGeometry(1.25 + r() * .3, 3.6 + s, 6)), L({ color: LEAF[(z * 7 | 0) % LEAF.length], emissive: '#0a2210', emissiveIntensity: .2 }));
      leaf.position.set(x, 2.1 + s * .7, z); leaf.scale.setScalar(s * .9); world.add(leaf);
    }
  };
  add(box(420, .14, 360), '#4f9a45', -40, -.07, 5);
  add(box(420, .14, 50), '#3f7e38', -40, -.07, -200);
  add(box(420, .14, 50), '#5aad50', -40, -.07, 210);
  add(box(280, .12, 7.2), '#8a8d86', -60, .04, 0);
  for (let k = 0; k < 170; k++) add(box(.55, .1, 3.4), '#6b4a2f', -140 + k * 1.55, .12, 0);
  [-.72, .72].forEach(z => add(box(270, .14, .14), '#b8c0c8', -60, .22, z));
  const platZ = -6.2;
  add(box(240, .55, 7.5), '#9aa0a6', -50, .35, platZ);
  add(box(240, .08, .55), '#f2c94c', -50, .66, platZ + 3.45);
  const st = new THREE.Group(); st.position.set(-6, 0, platZ - 5.2); world.add(st);
  add(box(10, 3.2, 6.5), '#e6c8a8', 0, 2.1, 0, st);
  add(box(11.2, .25, 7.4), '#d35400', 0, 3.85, 0, st);
  add(box(11.6, 1.4, 7.8), '#c0392b', 0, 4.55, 0, st);
  [[-2.2, 2.2], [2.2, 2.2]].forEach(([x, z]) => {
    const w = new THREE.Mesh(box(.1, 1.6, 1.8), new THREE.MeshBasicMaterial({ color: 0x9fd0ff }));
    w.position.set(x, 2.2, z); st.add(w);
  });
  [-120, -80, -40, -6, 10, 30].forEach(x => {
    add(box(.12, 4.6, .12), '#222', x, 2.6, platZ + 2.6);
    const bulb = new THREE.Mesh(box(.35, .2, .35), new THREE.MeshBasicMaterial({ color: 0xfff2c0 }));
    bulb.position.set(x, 4.75, platZ + 2.6); world.add(bulb);
  });
  (() => {
    const nbX = -6, nbY = 6.4, nbZ = platZ - 1.7;
    add(box(.2, 2.4, .2), '#2b2f3a', nbX - 4.1, nbY - 1.0, nbZ);
    add(box(.2, 2.4, .2), '#2b2f3a', nbX + 4.1, nbY - 1.0, nbZ);
    add(box(8.6, .28, .28), '#2b2f3a', nbX, nbY + .95, nbZ);
    const cv = document.createElement('canvas'); cv.width = 1024; cv.height = 256;
    const c2 = cv.getContext('2d');
    c2.fillStyle = '#162033'; c2.fillRect(0, 0, 1024, 256);
    c2.strokeStyle = '#ffd27a'; c2.lineWidth = 14; c2.strokeRect(18, 18, 988, 220);
    c2.fillStyle = '#ffd27a'; c2.font = '700 92px system-ui,Segoe UI,sans-serif'; c2.textAlign = 'center'; c2.textBaseline = 'middle';
    c2.fillText('UNITY STATION', 512, 118);
    c2.fillStyle = '#f3ead6'; c2.font = '500 34px system-ui,Segoe UI,sans-serif';
    c2.fillText('THE INFINITE EXPRESS', 512, 188);
    const tex = new THREE.CanvasTexture(cv);
    const face = new THREE.Mesh(new THREE.PlaneGeometry(8.2, 2.05), new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide }));
    face.position.set(nbX, nbY, nbZ + .22); world.add(face);
  })();
  for (let i = 0; i < 55; i++) {
    const x = -140 + r() * 220, z = platZ - 14 - r() * 55;
    if (Math.abs(x + 6) < 10 && z > platZ - 12) continue;
    addTree(x, z, i % 2);
  }
  for (let i = 0; i < 40; i++) {
    const x = -130 + r() * 210, z = 16 + r() * 70;
    addTree(x, z, 1);
  }
})();

const train = new THREE.Group(); scene.add(train);
const bodyM = inst(box(9.4, 3, 3), L({ color: '#f1e3c4' }), COACHES, (i, m, c) => { m.position.set(cxp(i), 2.65, 0); c.set('#f1e3c4'); });
train.add(bodyM,
  inst(box(9.45, 1, 3.04), L(), COACHES, (i, m, c) => { m.position.set(cxp(i), 1.65, 0); c.set('#8a2332'); }),
  inst(box(9.5, .12, 3.06), L(), COACHES, (i, m, c) => { m.position.set(cxp(i), 2.2, 0); c.set('#d9a441'); }),
  inst(box(9.7, .3, 3.2), L(), COACHES, (i, m, c) => { m.position.set(cxp(i), 4.3, 0); c.set('#4b5160'); }),
  inst(box(9.2, .5, 2.4), L(), COACHES, (i, m, c) => { m.position.set(cxp(i), .95, 0); c.set('#2b2f3a'); }),
  inst(box(.7, 2.8, 2.4), L(), COACHES, (i, m, c) => { m.position.set(cxp(i) + 5, 2.6, 0); c.set('#2a2d36'); }),
  inst(flat(new THREE.CylinderGeometry(.45, .45, .25, 10).rotateX(Math.PI / 2)), L(), COACHES * 8, (i, m, c) => {
    const k = i % 8, ci = i / 8 | 0;
    m.position.set(cxp(ci) + [-3.6, -2.4, 2.4, 3.6][k >> 1], .55, k % 2 ? 1.15 : -1.15);
    c.set('#1a1c22');
  })
);
const winMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
const wins = inst(new THREE.PlaneGeometry(1.25, 1), winMat, TOTAL, (i, m, c) => {
  const coach = i / SPC | 0, local = i % SPC, side = local < BAYS ? 1 : -1, bay = local % BAYS;
  m.position.set(cxp(coach) + (bay - 2) * 1.7, 2.9, side * 1.51);
  if (side < 0) m.rotation.y = Math.PI;
  c.set('#1a2236'); /* empty seats by default for manual shoot */
});
train.add(wins);

const lo = new THREE.Group(); lo.position.x = ENGINE_X; train.add(lo);
const STACK = { x: 3.55, y: 5.35 };
(() => {
  const add = (geo, col, x, y, z, rx, ry, rz) => {
    const m = new THREE.Mesh(geo, L({ color: col }));
    m.position.set(x, y, z); if (rx) m.rotation.x = rx; if (ry) m.rotation.y = ry; if (rz) m.rotation.z = rz;
    lo.add(m); return m;
  };
  const BLK = '#1a1a1a', RED = '#c62828', GOLD = '#c9a227', GRY = '#8a8f98', DK = '#111111';
  add(box(10.8, .35, 2.4), BLK, .3, 1.05, 0);
  add(box(11.0, .18, 2.7), RED, .3, 1.28, 0);
  add(flat(new THREE.CylinderGeometry(1.35, 1.35, 7.2, 12)), BLK, .9, 2.75, 0, 0, 0, Math.PI / 2);
  [-2.2, -.9, .4, 1.7, 3].forEach(x => add(flat(new THREE.CylinderGeometry(1.42, 1.42, .12, 12)), GOLD, x, 2.75, 0, 0, 0, Math.PI / 2));
  add(flat(new THREE.CylinderGeometry(.42, .55, 1.35, 8)), BLK, STACK.x, 4.35, 0);
  add(flat(new THREE.CylinderGeometry(.95, .42, .55, 8)), BLK, STACK.x, 5.15, 0);
  add(flat(new THREE.SphereGeometry(.55, 10, 8)), BLK, .35, 4.15, 0);
  add(box(.7, .7, .55), BLK, 4.95, 3.55, 0);
  const lamp = new THREE.Mesh(new THREE.SphereGeometry(.22, 8, 6), new THREE.MeshBasicMaterial({ color: 0xfff3b0 }));
  lamp.position.set(5.3, 3.55, 0); lo.add(lamp);
  const beam = new THREE.SpotLight(0xffe8b0, 1.2, 48, .42, .55, 1);
  beam.position.set(5.35, 3.55, 0); beam.target.position.set(26, 1.0, 0); lo.add(beam); lo.add(beam.target);
  add(box(1.6, .15, 2.6), RED, 5.55, .55, 0);
  add(box(2.7, .2, 3.0), BLK, -2.7, 1.7, 0);
  add(box(2.7, .2, 3.0), RED, -2.7, 4.55, 0);
  add(box(2.9, .14, 3.2), RED, -2.7, 4.78, 0);
  add(box(2.6, 1.0, 0.18), BLK, -2.7, 2.2, 1.46);
  add(box(2.6, .7, 0.18), BLK, -2.7, 4.1, 1.46);
  add(box(2.6, 1.0, 0.18), BLK, -2.7, 2.2, -1.46);
  add(box(2.6, .7, 0.18), BLK, -2.7, 4.1, -1.46);
  add(box(1.4, 2.35, 2.7), BLK, -4.85, 2.75, 0);
  add(box(1.5, .22, 2.9), RED, -4.85, 4.0, 0);
  const mkWheel = (x, r, z) => {
    add(flat(new THREE.CylinderGeometry(r, r, .28, 10)), GRY, x, r + .08, z, Math.PI / 2, 0, 0);
    add(flat(new THREE.CylinderGeometry(r * .35, r * .35, .32, 8)), DK, x, r + .08, z, Math.PI / 2, 0, 0);
  };
  [-1.15, 1.15].forEach(z => { mkWheel(4.15, .55, z); mkWheel(1.9, 1.05, z); mkWheel(.15, 1.05, z); mkWheel(-1.6, 1.05, z); });
  const pilotG = new THREE.Group(); pilotG.position.set(-2.55, 1.95, 0); lo.add(pilotG);
  const pBody = new THREE.Mesh(box(.72, .95, .48), L({ color: RED })); pBody.position.set(0, 1.15, 0); pilotG.add(pBody);
  const pHead = new THREE.Mesh(new THREE.SphereGeometry(.32, 12, 10), L({ color: '#d9a46f' }));
  pHead.position.set(0, 1.95, 0); pilotG.add(pHead);
})();

const puffs = new THREE.InstancedMesh(flat(new THREE.IcosahedronGeometry(.55, 0)), L({ color: 0xd8d8d8 }), 28);
const age = Array.from({ length: 28 }, (_, i) => i / 28);
puffs.frustumCulled = false; scene.add(puffs);

/* ---------- Free-fly camera ---------- */
const keys = Object.create(null);
const camPos = new THREE.Vector3(16.5, 3.8, 7.5);
let yaw = -0.35, pitch = -0.08;
const MOVE = 14; /* units/sec */
const LOOK = 0.0025;
let dragging = false, lastMX = 0, lastMY = 0;

function resetCam() {
  /* beside the loco, looking back at the engine / coaches */
  camPos.set(16.8, 3.9, 8.2);
  yaw = Math.PI + 0.32;
  pitch = -0.06;
}

function applyCam() {
  cam.position.copy(camPos);
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  cam.lookAt(camPos.x + sy * cp, camPos.y + sp, camPos.z + cy * cp);
  cam.updateProjectionMatrix();
}

function updateMove(dt) {
  const forward = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
  const right = new THREE.Vector3(Math.sin(yaw + Math.PI / 2), 0, Math.cos(yaw + Math.PI / 2));
  const spd = (keys.ShiftLeft || keys.ShiftRight ? MOVE * 2.2 : MOVE) * dt;
  if (keys.KeyW) camPos.addScaledVector(forward, spd);
  if (keys.KeyS) camPos.addScaledVector(forward, -spd);
  if (keys.KeyA) camPos.addScaledVector(right, spd);
  if (keys.KeyD) camPos.addScaledVector(right, -spd);
  if (keys.KeyE) camPos.y += spd;
  if (keys.KeyQ) camPos.y -= spd;
  camPos.y = cl(camPos.y, 0.6, 40);
  camPos.x = cl(camPos.x, -120, 40);
  camPos.z = cl(camPos.z, -40, 60);
}

addEventListener('keydown', e => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  keys[e.code] = true;
  if (['KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyQ', 'KeyE'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });

stage.addEventListener('pointerdown', e => {
  stage.focus();
  dragging = true;
  lastMX = e.clientX; lastMY = e.clientY;
  try { stage.setPointerCapture(e.pointerId); } catch (err) {}
});
stage.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastMX, dy = e.clientY - lastMY;
  lastMX = e.clientX; lastMY = e.clientY;
  yaw -= dx * LOOK;
  pitch -= dy * LOOK;
  pitch = cl(pitch, -1.35, 1.35);
});
stage.addEventListener('pointerup', () => { dragging = false; });
stage.addEventListener('pointercancel', () => { dragging = false; });

/* ---------- Record ---------- */
let recorder = null, recChunks = [], recording = false, recStart = 0;
let audioCtx = null, mediaDest = null, voSource = null, monitorGain = null;

function fmt(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + String(sec).padStart(2, '0');
}

function pickMime() {
  const types = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm;codecs=vp9', 'video/webm'];
  for (const t of types) if (window.MediaRecorder && MediaRecorder.isTypeSupported(t)) return t;
  return '';
}

async function ensureAudioGraph() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  if (!audioCtx) {
    audioCtx = new AC();
    monitorGain = audioCtx.createGain();
    monitorGain.gain.value = 1;
    monitorGain.connect(audioCtx.destination);
    mediaDest = audioCtx.createMediaStreamDestination();
    try {
      voSource = audioCtx.createMediaElementSource(vo);
      voSource.connect(monitorGain);
      voSource.connect(mediaDest);
    } catch (e) {}
  }
  if (audioCtx.state === 'suspended') await audioCtx.resume();
  return audioCtx;
}

async function startRec() {
  stage.focus();
  await ensureAudioGraph();
  const fps = 30;
  const vStream = comp.captureStream(fps);
  const tracks = [...vStream.getVideoTracks()];
  if (withVo.checked && mediaDest) {
    tracks.push(...mediaDest.stream.getAudioTracks());
    try { vo.currentTime = 0; vo.volume = 1; await vo.play(); } catch (e) {}
  }
  const mixed = new MediaStream(tracks);
  const mime = pickMime();
  recChunks = [];
  try {
    recorder = mime
      ? new MediaRecorder(mixed, { mimeType: mime, videoBitsPerSecond: 8_000_000 })
      : new MediaRecorder(mixed, { videoBitsPerSecond: 8_000_000 });
  } catch (e) {
    stateLabel.textContent = 'Recorder failed';
    return;
  }
  recorder.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
  recorder.onstop = () => {
    const blob = new Blob(recChunks, { type: recorder.mimeType || 'video/webm' });
    const url = URL.createObjectURL(blob);
    dl.href = url;
    dl.classList.add('show');
    stateLabel.textContent = (blob.size / 1e6).toFixed(1) + ' MB ready';
    recording = false;
    recDot.classList.remove('on');
    document.getElementById('btnRec').classList.remove('on');
    document.getElementById('btnRec').disabled = false;
    document.getElementById('btnStop').disabled = true;
    try { vo.pause(); } catch (e) {}
  };
  recorder.start(200);
  recording = true;
  recStart = performance.now();
  recDot.classList.add('on');
  document.getElementById('btnRec').classList.add('on');
  document.getElementById('btnRec').disabled = true;
  document.getElementById('btnStop').disabled = false;
  dl.classList.remove('show');
  stateLabel.textContent = 'Recording…';
}

function stopRec() {
  if (!recorder || recorder.state === 'inactive') {
    recording = false;
    document.getElementById('btnRec').disabled = false;
    document.getElementById('btnStop').disabled = true;
    return;
  }
  try { recorder.stop(); } catch (e) {}
  try { vo.pause(); } catch (e) {}
}

document.getElementById('btnRec').onclick = () => startRec();
document.getElementById('btnStop').onclick = () => stopRec();
document.getElementById('btnReset').onclick = () => { resetCam(); stage.focus(); };

/* ---------- Render loop ---------- */
let last = 0;
function frame(now) {
  const t = now * 0.001;
  const dt = Math.min(0.05, t - (last || t));
  last = t;
  updateMove(dt);
  applyCam();

  /* idle smoke */
  for (let i = 0; i < 28; i++) {
    const a = (age[i] + t * 0.1) % 1;
    M.rotation.set(a, a * 2, 0);
    M.position.set(ENGINE_X + STACK.x - a * 1.1, STACK.y + a * 3.6, Math.sin(i * 7 + t) * .25);
    M.scale.setScalar((.35 + a * 1.35) * (1 - a * .4));
    M.updateMatrix(); puffs.setMatrixAt(i, M.matrix);
  }
  puffs.instanceMatrix.needsUpdate = true;

  renderer.render(scene, cam);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, VW, VH);
  ctx.drawImage(glCanvas, 0, 0, VW, VH);

  if (recording) recTimeEl.textContent = fmt((performance.now() - recStart) / 1000);
  requestAnimationFrame(frame);
}

resetCam();
applyCam();
stage.focus();
requestAnimationFrame(frame);
})();
</script>
