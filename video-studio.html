<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Infinite Express · 3D Reel</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Playfair+Display:ital,wght@0,700;1,600&display=swap" rel="stylesheet">
<style>
:root{--gold:#ffd27a;--ink:#f2ead8;--muted:#9a9484}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#07090e;color:var(--ink);font:14px/1.4 Manrope,system-ui,sans-serif}
body{display:grid;grid-template-rows:1fr auto;min-height:100%}
#wrap{display:grid;place-items:center;padding:14px;min-height:0}
#stage{position:relative;width:min(46vh,360px);aspect-ratio:9/16;background:#000;border:1px solid rgba(255,210,120,.28);border-radius:4px;overflow:hidden;box-shadow:0 20px 70px rgba(0,0,0,.55)}
#comp,#gl{display:block;width:100%;height:100%;object-fit:contain;background:#000}
#gl{position:absolute;left:-9999px;width:1080px;height:1920px;pointer-events:none}
#bar{border-top:1px solid rgba(255,210,120,.14);background:rgba(10,12,18,.96);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,a.btn{appearance:none;border:1px solid rgba(255,210,120,.35);background:#1a2034;color:var(--ink);border-radius:10px;padding:10px 14px;min-height:42px;font:600 13px Manrope;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
button:disabled{opacity:.4;cursor:default}
button.primary{background:linear-gradient(180deg,#3a4578,#2a335c);color:var(--gold);border-color:rgba(255,210,120,.55)}
button.download{background:linear-gradient(180deg,#2f6b45,#1f4a30);color:#d8ffe6;border-color:rgba(120,220,150,.45)}
#timeline{width:min(420px,55vw);accent-color:var(--gold)}
.time{font:700 12px ui-monospace,Consolas,monospace;color:var(--gold)}
.muted{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="gl" width="1080" height="1920"></canvas>
    <canvas id="comp" width="1080" height="1920"></canvas>
  </div>
</div>
<section id="bar">
  <div class="row">
    <input id="timeline" type="range" min="0" max="28640" value="0" step="16">
    <span class="time" id="cur">0:00.0</span><span class="muted">/</span><span class="time" id="dur">0:28.6</span>
    <span class="muted" id="state">Ready</span>
  </div>
  <div class="row">
    <button id="play" class="primary" type="button">▶ Play</button>
    <button id="pause" type="button" disabled>⏸ Pause</button>
    <button id="restart" type="button">↻ Restart</button>
    <button id="dl" class="download" type="button" title="Export full reel with voiceover">⬇ Download Video</button>
  </div>
</section>
<audio id="vo" src="assets/audio/infinite-express-voiceover.mp3?v=drew-abs-v1" preload="auto" crossorigin="anonymous"></audio>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
/*
  Real 3D reel. Reference PNGs are CAMERA TARGETS only — not drawn as footage.
  Shot map (from your stills):
  1) loco 3/4 at Unity Station
  2) high reveal of Infinite Express
  3) low side glide along empty coaches
  4) high isometric long consist + departure
*/
const VW=1080, VH=1920;
const COACHES=10, SPC=10, BAYS=5, TOTAL=COACHES*SPC, CLEN=10, ENGINE_X=11;
const cxp=c=>-c*CLEN;
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const easeInOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOut=t=>1-Math.pow(1-t,3);
const fmt=s=>{const m=Math.floor(s/60),x=s-m*60;return m+':'+x.toFixed(1).padStart(4,'0')};

const glCanvas=document.getElementById('gl');
const comp=document.getElementById('comp');
const ctx=comp.getContext('2d');
const vo=document.getElementById('vo');
const timeline=document.getElementById('timeline');
const curEl=document.getElementById('cur');
const durEl=document.getElementById('dur');
const stateEl=document.getElementById('state');
const dlBtn=document.getElementById('dl');

/* Absolute caption sheet (wall clock): DAY-1 → CTA */
let DURATION=28.64, t=0, playing=false, scrubbing=false, lastWall=0;
let recorder=null, chunks=[], exporting=false;
let audioCtx=null, dest=null, voSrc=null, gain=null;
let ticketImg=null;

/* ===== Three.js world ===== */
const renderer=new THREE.WebGLRenderer({canvas:glCanvas,antialias:true,alpha:false,preserveDrawingBuffer:true,powerPreference:'high-performance'});
renderer.setSize(VW,VH,false); renderer.setPixelRatio(1);
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(46,VW/VH,.35,2600);
/* Dusk look learned from Day - 1.mp4 reference reel */
const sky=new THREE.Color('#2a1a48');
scene.background=sky; scene.fog=new THREE.FogExp2(0x3a2058,.0085);
const hemi=new THREE.HemisphereLight(0xffc9a8,0x1a1430,.75);
const sun=new THREE.DirectionalLight(0xffb070,1.35); sun.position.set(55,35,-20);
scene.add(hemi,sun);
const rim=new THREE.DirectionalLight(0x7a5cff,.35); rim.position.set(-30,20,40); scene.add(rim);
const head=new THREE.PointLight(0xffe6a0,.7,50); head.position.set(ENGINE_X+5.3,3.55,0); scene.add(head);
const glow=new THREE.PointLight(0xff9a4a,.45,90); glow.position.set(8,10,-18); scene.add(glow);
/* sparse stars */
(()=>{
  const g=new THREE.BufferGeometry(), n=120, pos=new Float32Array(n*3);
  for(let i=0;i<n;i++){pos[i*3]=(Math.random()-.5)*220; pos[i*3+1]=28+Math.random()*70; pos[i*3+2]=-40-Math.random()*120}
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xfff5e6,size:.35,sizeAttenuation:true,transparent:true,opacity:.85})));
})();

const L=o=>new THREE.MeshLambertMaterial(o), box=(x,y,z)=>new THREE.BoxGeometry(x,y,z);
const flat=g=>{g=g.toNonIndexed();g.computeVertexNormals();return g};
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const M=new THREE.Object3D(), Col=new THREE.Color();
function inst(geo,mat,n,fn){const m=new THREE.InstancedMesh(geo,mat,n);for(let i=0;i<n;i++){M.position.set(0,0,0);M.rotation.set(0,0,0);M.scale.set(1,1,1);fn(i,M,Col);M.updateMatrix();m.setMatrixAt(i,M.matrix);m.setColorAt(i,Col)}m.frustumCulled=false;return m}

const world=new THREE.Group(); scene.add(world);
(()=>{
  const add=(geo,col,x,y,z,parent=world,rx,ry,rz)=>{const m=new THREE.Mesh(geo,L({color:col}));m.position.set(x,y,z);if(rx)m.rotation.x=rx;if(ry)m.rotation.y=ry;if(rz)m.rotation.z=rz;parent.add(m);return m};
  const r=rng(21);
  const LEAF=['#1b5e2a','#246b32','#2f7a38','#185024','#3a8a42','#207038'];
  const addTree=(x,z,kind)=>{
    const s=.75+r()*1.1;
    add(new THREE.CylinderGeometry(.2+r()*.1,.28,.9+s*.4,5),'#5a3a22',x,.55+s*.15,z);
    if(kind===0){const leaf=new THREE.Mesh(flat(new THREE.IcosahedronGeometry(1.35,0)),L({color:LEAF[(x*10|0)%LEAF.length],emissive:'#0d2814',emissiveIntensity:.22}));leaf.position.set(x,1.55+s*.5,z);leaf.scale.setScalar(s);world.add(leaf)}
    else{const leaf=new THREE.Mesh(flat(new THREE.ConeGeometry(1.25+r()*.3,3.6+s,6)),L({color:LEAF[(z*7|0)%LEAF.length],emissive:'#0a2210',emissiveIntensity:.2}));leaf.position.set(x,2.1+s*.7,z);leaf.scale.setScalar(s*.9);world.add(leaf)}
  };
  add(box(420,.14,360),'#1f3a28',-40,-.07,5);
  add(box(420,.14,50),'#3f7e38',-40,-.07,-200);
  add(box(420,.14,50),'#5aad50',-40,-.07,210);
  add(box(280,.12,7.2),'#8a8d86',-60,.04,0);
  for(let k=0;k<170;k++)add(box(.55,.1,3.4),'#6b4a2f',-140+k*1.55,.12,0);
  [-.72,.72].forEach(z=>add(box(270,.14,.14),'#b8c0c8',-60,.22,z));
  const platZ=-6.2;
  add(box(240,.55,7.5),'#9aa0a6',-50,.35,platZ);
  add(box(240,.08,.55),'#f2c94c',-50,.66,platZ+3.45);
  const st=new THREE.Group(); st.position.set(-6,0,platZ-5.2); world.add(st);
  add(box(10,3.2,6.5),'#e6c8a8',0,2.1,0,st);
  add(box(11.2,.25,7.4),'#d35400',0,3.85,0,st);
  add(box(11.6,1.4,7.8),'#c0392b',0,4.55,0,st);
  [[-2.2,2.2],[2.2,2.2]].forEach(([x,z])=>{const w=new THREE.Mesh(box(.1,1.6,1.8),new THREE.MeshBasicMaterial({color:0x9fd0ff}));w.position.set(x,2.2,z);st.add(w)});
  [-120,-80,-40,-6,10,30].forEach(x=>{
    add(box(.12,4.6,.12),'#222',x,2.6,platZ+2.6);
    const bulb=new THREE.Mesh(box(.35,.2,.35),new THREE.MeshBasicMaterial({color:0xfff2c0}));bulb.position.set(x,4.75,platZ+2.6);world.add(bulb);
  });
  (()=>{
    const nbX=-6,nbY=6.4,nbZ=platZ-1.7;
    add(box(.2,2.4,.2),'#2b2f3a',nbX-4.1,nbY-1.0,nbZ);
    add(box(.2,2.4,.2),'#2b2f3a',nbX+4.1,nbY-1.0,nbZ);
    add(box(8.6,.28,.28),'#2b2f3a',nbX,nbY+.95,nbZ);
    const cv=document.createElement('canvas'); cv.width=1024; cv.height=256;
    const c2=cv.getContext('2d');
    c2.fillStyle='#162033'; c2.fillRect(0,0,1024,256);
    c2.strokeStyle='#ffd27a'; c2.lineWidth=14; c2.strokeRect(18,18,988,220);
    c2.fillStyle='#ffd27a'; c2.font='700 92px system-ui,Segoe UI,sans-serif'; c2.textAlign='center'; c2.textBaseline='middle';
    c2.fillText('UNITY STATION',512,118);
    c2.fillStyle='#f3ead6'; c2.font='500 34px system-ui,Segoe UI,sans-serif';
    c2.fillText('THE INFINITE EXPRESS',512,188);
    const tex=new THREE.CanvasTexture(cv);
    const face=new THREE.Mesh(new THREE.PlaneGeometry(8.2,2.05),new THREE.MeshBasicMaterial({map:tex,side:THREE.DoubleSide}));
    face.position.set(nbX,nbY,nbZ+.22); world.add(face);
  })();
  for(let i=0;i<55;i++){const x=-140+r()*220,z=platZ-14-r()*55;if(Math.abs(x+6)<10&&z>platZ-12)continue;addTree(x,z,i%2)}
  for(let i=0;i<40;i++){const x=-130+r()*210,z=16+r()*70;addTree(x,z,1)}
})();

const train=new THREE.Group(); scene.add(train);
const bodyM=inst(box(9.4,3,3),L({color:'#f1e3c4'}),COACHES,(i,m,c)=>{m.position.set(cxp(i),2.65,0);c.set('#f1e3c4')});
train.add(bodyM,
  inst(box(9.45,1,3.04),L(),COACHES,(i,m,c)=>{m.position.set(cxp(i),1.65,0);c.set('#8a2332')}),
  inst(box(9.5,.12,3.06),L(),COACHES,(i,m,c)=>{m.position.set(cxp(i),2.2,0);c.set('#d9a441')}),
  inst(box(9.7,.3,3.2),L(),COACHES,(i,m,c)=>{m.position.set(cxp(i),4.3,0);c.set('#4b5160')}),
  inst(box(9.2,.5,2.4),L(),COACHES,(i,m,c)=>{m.position.set(cxp(i),.95,0);c.set('#2b2f3a')}),
  inst(box(.7,2.8,2.4),L(),COACHES,(i,m,c)=>{m.position.set(cxp(i)+5,2.6,0);c.set('#2a2d36')}),
  inst(flat(new THREE.CylinderGeometry(.45,.45,.25,10).rotateX(Math.PI/2)),L(),COACHES*8,(i,m,c)=>{
    const k=i%8,ci=i/8|0;m.position.set(cxp(ci)+[-3.6,-2.4,2.4,3.6][k>>1],.55,k%2?1.15:-1.15);c.set('#1a1c22');
  })
);
const winMat=new THREE.MeshBasicMaterial({color:0xffffff});
const wins=inst(new THREE.PlaneGeometry(1.25,1),winMat,TOTAL,(i,m,c)=>{
  const coach=i/SPC|0,local=i%SPC,side=local<BAYS?1:-1,bay=local%BAYS;
  m.position.set(cxp(coach)+(bay-2)*1.7,2.9,side*1.51);
  if(side<0)m.rotation.y=Math.PI; c.set('#1a2236');
});
train.add(wins);

const lo=new THREE.Group(); lo.position.x=ENGINE_X; train.add(lo);
const STACK={x:3.55,y:5.35};
(()=>{
  const add=(geo,col,x,y,z,rx,ry,rz)=>{const m=new THREE.Mesh(geo,L({color:col}));m.position.set(x,y,z);if(rx)m.rotation.x=rx;if(ry)m.rotation.y=ry;if(rz)m.rotation.z=rz;lo.add(m);return m};
  const BLK='#1a1a1a',RED='#c62828',GOLD='#c9a227',GRY='#8a8f98',DK='#111111';
  add(box(10.8,.35,2.4),BLK,.3,1.05,0);
  add(box(11.0,.18,2.7),RED,.3,1.28,0);
  add(flat(new THREE.CylinderGeometry(1.35,1.35,7.2,12)),BLK,.9,2.75,0,0,0,Math.PI/2);
  [-2.2,-.9,.4,1.7,3].forEach(x=>add(flat(new THREE.CylinderGeometry(1.42,1.42,.12,12)),GOLD,x,2.75,0,0,0,Math.PI/2));
  add(flat(new THREE.CylinderGeometry(.42,.55,1.35,8)),BLK,STACK.x,4.35,0);
  add(flat(new THREE.CylinderGeometry(.95,.42,.55,8)),BLK,STACK.x,5.15,0);
  add(flat(new THREE.SphereGeometry(.55,10,8)),BLK,.35,4.15,0);
  add(box(.7,.7,.55),BLK,4.95,3.55,0);
  const lamp=new THREE.Mesh(new THREE.SphereGeometry(.22,8,6),new THREE.MeshBasicMaterial({color:0xfff3b0}));lamp.position.set(5.3,3.55,0);lo.add(lamp);
  const beam=new THREE.SpotLight(0xffe8b0,1.2,48,.42,.55,1);beam.position.set(5.35,3.55,0);beam.target.position.set(26,1,0);lo.add(beam);lo.add(beam.target);
  add(box(1.6,.15,2.6),RED,5.55,.55,0);
  add(box(2.7,.2,3.0),BLK,-2.7,1.7,0);
  add(box(2.7,.2,3.0),RED,-2.7,4.55,0);
  add(box(2.9,.14,3.2),RED,-2.7,4.78,0);
  add(box(2.6,1.0,.18),BLK,-2.7,2.2,1.46);
  add(box(2.6,.7,.18),BLK,-2.7,4.1,1.46);
  add(box(2.6,1.0,.18),BLK,-2.7,2.2,-1.46);
  add(box(2.6,.7,.18),BLK,-2.7,4.1,-1.46);
  add(box(1.4,2.35,2.7),BLK,-4.85,2.75,0);
  add(box(1.5,.22,2.9),RED,-4.85,4.0,0);
  const mkWheel=(x,r,z)=>{add(flat(new THREE.CylinderGeometry(r,r,.28,10)),GRY,x,r+.08,z,Math.PI/2,0,0);add(flat(new THREE.CylinderGeometry(r*.35,r*.35,.32,8)),DK,x,r+.08,z,Math.PI/2,0,0)};
  [-1.15,1.15].forEach(z=>{mkWheel(4.15,.55,z);mkWheel(1.9,1.05,z);mkWheel(.15,1.05,z);mkWheel(-1.6,1.05,z)});
  const pilotG=new THREE.Group();pilotG.position.set(-2.55,1.95,0);lo.add(pilotG);
  const pBody=new THREE.Mesh(box(.72,.95,.48),L({color:RED}));pBody.position.set(0,1.15,0);pilotG.add(pBody);
  const pHead=new THREE.Mesh(new THREE.SphereGeometry(.32,12,10),L({color:'#d9a46f'}));pHead.position.set(0,1.95,0);pilotG.add(pHead);
})();

const puffs=new THREE.InstancedMesh(flat(new THREE.IcosahedronGeometry(.55,0)),L({color:0xd8d8d8}),28);
const age=Array.from({length:28},(_,i)=>i/28);
puffs.frustumCulled=false; scene.add(puffs);

/* ===== Continuous cinematic camera (no reverse cuts, no spline overshoot) ===== */
const CAM=[
  /* loco 3/4 — slow push */
  {t:0.00, pos:[18.5,4.0,9.5], look:[13.5,3.2,0.2], fov:40},
  {t:2.40, pos:[17.4,3.85,8.6], look:[13.1,3.25,0.05], fov:38.5},
  {t:4.60, pos:[16.0,4.3,9.6], look:[11.0,3.1,0], fov:41},
  /* climb to high reveal */
  {t:5.80, pos:[13.2,7.6,12.4], look:[6.5,2.9,0.05], fov:44},
  {t:7.20, pos:[9.2,12.8,15.2], look:[1.5,2.55,0], fov:48},
  {t:8.40, pos:[5.5,13.6,16.0], look:[-4.0,2.5,0], fov:49},
  /* settle into low side glide (one continuous left pass) */
  {t:9.40, pos:[3.2,6.4,11.2], look:[-1.5,2.75,0.7], fov:42},
  {t:10.40, pos:[1.8,3.1,8.6], look:[-2.5,2.85,1.15], fov:38},
  {t:12.20, pos:[-3.5,2.9,8.3], look:[-7.5,2.9,1.15], fov:36},
  {t:14.20, pos:[-8.5,3.05,8.5], look:[-12.5,2.9,1.05], fov:35.5},
  {t:16.40, pos:[-13.0,3.35,9.0], look:[-17.5,2.85,0.4], fov:37},
  {t:17.80, pos:[-15.5,5.8,12.5], look:[-20.0,2.6,0.15], fov:42},
  /* rise to isometric / departure orbit */
  {t:19.00, pos:[-20.0,15.5,22.0], look:[-26.0,2.3,0], fov:50},
  {t:21.00, pos:[-26.5,21.0,28.5], look:[-32.0,2.1,0], fov:53},
  {t:23.20, pos:[-20.0,19.5,26.5], look:[-12.0,2.6,0], fov:50},
  {t:25.20, pos:[-8.0,16.5,22.0], look:[2.0,3.0,0], fov:48},
  {t:28.64, pos:[6.0,12.5,18.0], look:[12.0,3.2,0], fov:46}
];

const smoother=t=>{t=cl(t,0,1);return t*t*t*(t*(t*6-15)+10)};
function sampleCam(time){
  let i=0; while(i<CAM.length-1&&CAM[i+1].t<time)i++;
  const a=CAM[i], b=CAM[Math.min(i+1,CAM.length-1)];
  const u=a.t===b.t?0:smoother((time-a.t)/(b.t-a.t));
  return{
    pos:[lerp(a.pos[0],b.pos[0],u),lerp(a.pos[1],b.pos[1],u),lerp(a.pos[2],b.pos[2],u)],
    look:[lerp(a.look[0],b.look[0],u),lerp(a.look[1],b.look[1],u),lerp(a.look[2],b.look[2],u)],
    fov:lerp(a.fov,b.fov,u)
  };
}
let camSoft=null, camSoftT=-1;

function boardedCount(time){
  if(time<17.75) return 0;
  if(time<19.5) return Math.floor(easeOut((time-17.75)/1.75)*35);
  if(time<20.9) return 35+Math.floor(easeInOut((time-19.5)/1.4)*40);
  if(time<22.5) return 75+Math.floor(easeOut((time-20.9)/1.6)*25);
  return 100;
}

function applyWindows(time){
  const n=boardedCount(time);
  const highlight=time>=13.2&&time<17.8;
  for(let i=0;i<TOTAL;i++){
    if(i<n){wins.setColorAt(i,Col.set('#ffe08a'));continue}
    if(highlight&&i===2){const p=.55+.45*Math.sin(time*7);Col.setRGB(1,.78+.18*p,.38+.2*p);wins.setColorAt(i,Col);continue}
    wins.setColorAt(i,Col.set(time<13?'#0b1020':'#141a2c'));
  }
  wins.instanceColor.needsUpdate=true;
}

function applyCam(time){
  const c=sampleCam(time);
  const jumped=camSoftT<0||Math.abs(time-camSoftT)>.09;
  if(jumped||!camSoft){
    camSoft={pos:c.pos.slice(),look:c.look.slice(),fov:c.fov};
  }else{
    const dt=Math.min(.05,Math.abs(time-camSoftT)||.016);
    const k=1-Math.exp(-dt*9);
    for(let i=0;i<3;i++){
      camSoft.pos[i]=lerp(camSoft.pos[i],c.pos[i],k);
      camSoft.look[i]=lerp(camSoft.look[i],c.look[i],k);
    }
    camSoft.fov=lerp(camSoft.fov,c.fov,k);
  }
  camSoftT=time;
  cam.position.set(camSoft.pos[0],camSoft.pos[1],camSoft.pos[2]);
  cam.lookAt(camSoft.look[0],camSoft.look[1],camSoft.look[2]);
  cam.fov=camSoft.fov; cam.updateProjectionMatrix();
}

function applyWorld(time){
  /* eased departure with “Then we depart.” (~23.0) */
  const depart=time>23.0?14*easeOut(cl((time-23.0)/4.2,0,1)):0;
  train.position.x=depart;
  const smoke=time>23?0.35:(time>17.7?0.14:0.09);
  for(let i=0;i<28;i++){
    const a=(age[i]+time*smoke)%1;
    M.rotation.set(a,a*2,0);
    M.position.set(ENGINE_X+STACK.x-a*1.2+depart,STACK.y+a*(time>23?5:3.6),Math.sin(i*7+time)*.25);
    M.scale.setScalar((.4+a*(time>23?2:1.35))*(1-a*.35));
    M.updateMatrix(); puffs.setMatrixAt(i,M.matrix);
  }
  puffs.instanceMatrix.needsUpdate=true;
}

/* ===== Overlay HUD (avatars / follow / ticket / captions) ===== */
function roundRect(x,y,w,h,r){
  const rr=Math.min(r,w/2,h/2);
  ctx.beginPath();ctx.moveTo(x+rr,y);ctx.arcTo(x+w,y,x+w,y+h,rr);ctx.arcTo(x+w,y+h,x,y+h,rr);ctx.arcTo(x,y+h,x,y,rr);ctx.arcTo(x,y,x+w,y,rr);ctx.closePath();
}
function fade(time,a,b,f){f=f||.25;if(time<a||time>b)return 0;if(time<a+f)return easeOut((time-a)/f);if(time>b-f)return 1-easeOut((time-(b-f))/f);return 1}
function drawInstagram(x,y,size,a){
  if(a<=.01)return;
  const s=size;
  ctx.save(); ctx.globalAlpha=a; ctx.translate(x,y);
  const g=ctx.createLinearGradient(-s*.5,s*.5,s*.5,-s*.5);
  g.addColorStop(0,'#f58529'); g.addColorStop(.35,'#dd2a7b'); g.addColorStop(.7,'#8134af'); g.addColorStop(1,'#515bd4');
  roundRect(-s*.5,-s*.5,s,s,s*.22);
  ctx.fillStyle=g; ctx.shadowColor='rgba(0,0,0,.35)'; ctx.shadowBlur=18; ctx.shadowOffsetY=6; ctx.fill();
  ctx.shadowColor='transparent';
  ctx.strokeStyle='#fff'; ctx.lineWidth=s*.08;
  ctx.beginPath(); ctx.arc(0,0,s*.18,0,Math.PI*2); ctx.stroke();
  roundRect(-s*.28,-s*.28,s*.56,s*.56,s*.14);
  ctx.stroke();
  ctx.beginPath(); ctx.arc(s*.18,-s*.18,s*.05,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
  ctx.restore();
}
function drawAvatar(x,y,size,fill,glow){
  const s=size; ctx.save(); ctx.translate(x,y);
  ctx.beginPath(); ctx.arc(0,0,s*.52,0,Math.PI*2); ctx.strokeStyle='rgba(255,210,122,.4)'; ctx.lineWidth=4; ctx.stroke();
  ctx.save(); ctx.beginPath(); ctx.arc(0,0,s*.48,0,Math.PI*2); ctx.clip();
  ctx.fillStyle='#1a2236'; ctx.fillRect(-s,-s,s*2,s*2);
  const g=ctx.createLinearGradient(0,s*.5-s*fill,0,s*.5); g.addColorStop(0,'#ffd27a'); g.addColorStop(1,'#e08a3a');
  ctx.fillStyle=g; ctx.fillRect(-s,s*.5-s*fill,s*2,s*fill+2); ctx.restore();
  ctx.fillStyle=fill>.15?'#2b1f12':'#c9c2b4';
  ctx.beginPath(); ctx.arc(0,-s*.12,s*.18,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-s*.28,s*.42); ctx.quadraticCurveTo(-s*.28,s*.08,0,s*.08); ctx.quadraticCurveTo(s*.28,s*.08,s*.28,s*.42); ctx.closePath(); ctx.fill();
  if(glow){ctx.strokeStyle='#ffd27a';ctx.lineWidth=5;ctx.shadowColor='rgba(255,210,122,.7)';ctx.shadowBlur=20;ctx.beginPath();ctx.arc(0,0,s*.52,0,Math.PI*2);ctx.stroke()}
  ctx.restore();
}
/* Floating captions + HUD learned from Day - 1.mp4 */
function drawCaption(lines,y,a,size){
  if(a<=.01)return;
  size=size||58;
  ctx.save(); ctx.globalAlpha=a; ctx.textAlign='center'; ctx.textBaseline='middle';
  lines.forEach((l,i)=>{
    const yy=y+i*(size*1.18);
    ctx.font=`italic 700 ${size}px "Playfair Display",Georgia,serif`;
    ctx.lineJoin='round'; ctx.lineWidth=Math.max(8,size*.16);
    ctx.strokeStyle='rgba(0,0,0,.78)'; ctx.strokeText(l,VW/2,yy);
    ctx.shadowColor='rgba(255,170,70,.35)'; ctx.shadowBlur=14;
    ctx.fillStyle='#F6E4C4'; ctx.fillText(l,VW/2,yy);
    ctx.shadowColor='transparent';
  });
  ctx.restore();
}
function drawBadge(title,sub,a){
  if(a<=.01)return;
  ctx.save(); ctx.globalAlpha=a;
  const w=560,h=118,x=(VW-w)/2,y=VH*.08;
  roundRect(x,y,w,h,28);
  ctx.fillStyle='#F7EEDF'; ctx.shadowColor='rgba(0,0,0,.35)'; ctx.shadowBlur=16; ctx.shadowOffsetY=6; ctx.fill();
  ctx.shadowColor='transparent';
  ctx.setLineDash([7,7]); ctx.strokeStyle='#C9A36A'; ctx.lineWidth=3; ctx.stroke(); ctx.setLineDash([]);
  [[x+78,y+48,28],[x+108,y+52,24]].forEach(([cx,cy,r])=>{
    ctx.fillStyle='#1A2030';
    ctx.beginPath(); ctx.arc(cx,cy-10,r*.38,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx,cy+18,r*.55,r*.42,0,0,Math.PI*2); ctx.fill();
  });
  ctx.fillStyle='#1A2030'; ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.font='800 44px "Playfair Display",Georgia,serif'; ctx.fillText(title,x+150,y+46);
  ctx.font='italic 600 24px "Playfair Display",Georgia,serif'; ctx.fillStyle='#5A4A38';
  ctx.fillText(sub,x+150,y+82);
  ctx.restore();
}
function drawUrlPill(text,y,a){
  if(a<=.01)return;
  ctx.save(); ctx.globalAlpha=a;
  ctx.font='700 36px ui-monospace,Consolas,monospace';
  const tw=ctx.measureText(text).width, w=tw+70, h=70, x=(VW-w)/2;
  roundRect(x,y-h/2,w,h,34);
  ctx.fillStyle='#F7EEDF'; ctx.shadowColor='rgba(0,0,0,.3)'; ctx.shadowBlur=14; ctx.fill();
  ctx.shadowColor='transparent'; ctx.fillStyle='#1A2030';
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(text,VW/2,y);
  ctx.restore();
}
function drawSparkles(cx,cy,r,a,t){
  if(a<=.01)return;
  ctx.save(); ctx.globalAlpha=a; ctx.fillStyle='#ffd27a';
  for(let i=0;i<5;i++){
    const ang=i*1.25+t*.8, x=cx+Math.cos(ang)*r, y=cy+Math.sin(ang)*r*.7, s=10+((i*3)%7);
    ctx.beginPath();
    ctx.moveTo(x,y-s); ctx.lineTo(x+s*.28,y); ctx.lineTo(x,y+s); ctx.lineTo(x-s*.28,y); ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}
function drawCursor(x,y,sc){
  ctx.save(); ctx.translate(x,y); ctx.scale(sc||1,sc||1);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,34); ctx.lineTo(10,26); ctx.lineTo(18,42); ctx.lineTo(24,40); ctx.lineTo(16,22); ctx.lineTo(28,22); ctx.closePath();
  ctx.fillStyle='#fff'; ctx.strokeStyle='#111'; ctx.lineWidth=2; ctx.fill(); ctx.stroke(); ctx.restore();
}
function drawFollowModal(a,clicked){
  if(a<=.01)return;
  const w=820,h=260,x=(VW-w)/2,y=VH*.16;
  ctx.save(); ctx.globalAlpha=a;
  roundRect(x,y,w,h,28);
  ctx.fillStyle='#152038'; ctx.shadowColor='rgba(0,0,0,.45)'; ctx.shadowBlur=28; ctx.shadowOffsetY=10; ctx.fill();
  ctx.shadowColor='transparent'; ctx.strokeStyle='#C9A36A'; ctx.lineWidth=3; ctx.stroke();
  ctx.beginPath(); ctx.arc(x+90,y+90,52,0,Math.PI*2);
  const g=ctx.createLinearGradient(x+40,y+40,x+140,y+140);
  g.addColorStop(0,'#ffd27a'); g.addColorStop(1,'#e08a3a'); ctx.fillStyle=g; ctx.fill();
  ctx.fillStyle='#1A2030'; ctx.font='800 40px "Playfair Display",Georgia,serif';
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('IE',x+90,y+92);
  ctx.textAlign='left'; ctx.fillStyle='#F7EEDF';
  ctx.font='700 40px "Playfair Display",Georgia,serif'; ctx.fillText('infiniteexpress.live',x+170,y+72);
  ctx.font='italic 600 28px "Playfair Display",Georgia,serif'; ctx.fillStyle='#C9B8A0';
  ctx.fillText('Your seat is waiting.',x+170,y+118);
  roundRect(x+48,y+168,w-96,62,16);
  ctx.fillStyle=clicked?'#c13584':'#0095f6'; ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='800 32px Manrope,system-ui,sans-serif';
  ctx.textAlign='center'; ctx.fillText(clicked?'Following':'Follow',VW/2,y+200);
  ctx.restore();
}
function drawOverlays(time){
  const boarded=boardedCount(time);

  /* 0:00–0:01 DAY-1 */
  if(time<1.05){
    drawCaption(['DAY-1'],VH*.42,fade(time,0.0,1.0,.18),110);
  }

  /* Top badge: followers gate → live passenger count */
  if(time>=1.0&&time<8.2){
    drawBadge('100 Followers','required to start this train',fade(time,1.0,8.1,.25));
  }else if(time>=8.2&&time<23.2){
    drawBadge(boarded+' / 100','passengers boarded',fade(time,8.2,23.1,.2));
  }

  /* Hook captions — progressive phrases over the 3D shot */
  if(time>=1.8&&time<3.3) drawCaption(['What if 100'],VH*.62,fade(time,1.8,3.25,.18),64);
  if(time>=3.2&&time<5.1) drawCaption(['What if 100 people could start'],VH*.62,fade(time,3.2,5.05,.18),52);
  if(time>=5.0&&time<6.2) drawCaption(['without going anywhere?'],VH*.64,fade(time,5.0,6.15,.18),56);

  if(time>=6.1&&time<7.5) drawCaption(['This is the'],VH*.52,fade(time,6.1,7.45,.18),60);
  if(time>=7.2&&time<8.5) drawCaption(['Infinite Express.'],VH*.52,fade(time,7.2,8.45,.18),64);
  if(time>=8.4&&time<10.0) drawCaption(['Every seat'],VH*.58,fade(time,8.4,9.95,.18),64);
  if(time>=9.7&&time<11.5) drawCaption(['is empty right now,'],VH*.58,fade(time,9.7,11.45,.18),54);
  if(time>=11.3&&time<13.1) drawCaption(['but every seat is waiting'],VH*.56,fade(time,11.3,13.05,.18),50);

  /* Follow modal + cursor */
  if(time>=12.8&&time<14.7){
    const fa=fade(time,12.8,14.65,.18);
    const clicked=time>=13.9;
    drawFollowModal(fa,clicked);
    if(time<14.2){
      const cu=easeInOut(cl((time-12.95)/.7,0,1));
      drawCursor(lerp(VW*.78,VW*.55,cu),lerp(VH*.62,VH*.30,cu),1+(time>=13.75&&time<14.05?.15:0));
    }
  }

  /* Ticket + claim/seat */
  if(time>=14.4&&time<17.9&&ticketImg){
    const pa=fade(time,14.4,17.85,.2);
    const pop=easeOut(cl((time-14.4)/.4,0,1));
    const scale=lerp(.82,1,pop);
    const tw=820*scale, th=tw*(ticketImg.height/ticketImg.width);
    ctx.save(); ctx.globalAlpha=pa; ctx.translate(VW/2,VH*.34); ctx.rotate((1-pop)*-.04);
    ctx.drawImage(ticketImg,-tw/2,-th/2,tw,th); ctx.restore();
    drawSparkles(VW/2,VH*.34,tw*.55,pa,time);
    if(time<16.1) drawCaption(['Claim your free','passenger ticket.'],VH*.72,fade(time,14.5,16.05,.18),50);
    else drawCaption(['Get your own seat','on the train.'],VH*.72,fade(time,16.05,17.85,.18),50);
  }

  /* Board / grow / 100 */
  if(time>=17.7&&time<19.6) drawCaption(['And as more people','board,'],VH*.70,fade(time,17.7,19.55,.18),52);
  if(time>=19.4&&time<21.0) drawCaption(['the train grows with','them.'],VH*.68,fade(time,19.4,20.95,.18),54);
  if(time>=20.85&&time<23.0) drawCaption(['100 passengers.'],VH*.62,fade(time,20.85,22.95,.18),64);

  if(time>=22.95&&time<24.4) drawCaption(['Then we depart.'],VH*.58,fade(time,22.95,24.35,.18),60);

  /* End CTA — Instagram + Follow at + URL pill (Day-1 style) */
  if(time>=24.4&&time<27.2){
    const fa=fade(time,24.4,27.15,.2);
    drawInstagram(VW/2,VH*.42,170,fa);
    drawSparkles(VW/2,VH*.42,150,fa,time);
    drawCaption(['Follow at'],VH*.56,fa,54);
    drawUrlPill('infiniteexpress.live',VH*.64,fa);
  }
  if(time>=26.9&&time<=DURATION+0.05){
    const a=fade(time,26.9,DURATION,.25);
    drawInstagram(VW/2,VH*.38,150,a*.85);
    drawCaption(['Your seat'],VH*.54,a,58);
    drawUrlPill('infiniteexpress.live',VH*.72,a);
  }

  /* Depart motion streaks */
  if(time>23.2){
    const a=cl((time-23.2)/1.2,0,.45);
    ctx.save(); ctx.globalAlpha=a; ctx.strokeStyle='rgba(255,240,210,.55)'; ctx.lineWidth=3;
    for(let i=0;i<10;i++){
      const y=VH*.55+i*38, len=80+i*18;
      ctx.beginPath(); ctx.moveTo(VW*.12,y); ctx.lineTo(VW*.12+len,y); ctx.stroke();
    }
    ctx.restore();
  }
}

function renderFrame(time){
  applyWindows(time);
  applyWorld(time);
  applyCam(time);
  renderer.render(scene,cam);
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,VW,VH);
  ctx.drawImage(glCanvas,0,0,VW,VH);
  drawOverlays(time);
}

function seek(nt){
  t=cl(nt,0,DURATION);
  timeline.value=String(Math.round(t*1000));
  curEl.textContent=fmt(t);
  camSoft=null; camSoftT=-1;
  if(Math.abs((vo.currentTime||0)-t)>.08){try{vo.currentTime=t}catch(e){}}
}

function tick(now){
  const wall=now*.001; const dt=Math.min(.05,wall-(lastWall||wall)); lastWall=wall;
  if(playing&&!scrubbing){
    if(!vo.paused&&Number.isFinite(vo.currentTime)) t=Math.min(vo.currentTime,DURATION);
    else t=Math.min(DURATION,t+dt);
    timeline.value=String(Math.round(t*1000)); curEl.textContent=fmt(t);
    if(t>=DURATION-.03){
      playing=false; vo.pause();
      if(exporting) finishExport();
      else{ updateBtns(); stateEl.textContent='Ended'; }
    }
  }
  renderFrame(t);
  requestAnimationFrame(tick);
}

function updateBtns(){
  document.getElementById('play').disabled=playing||exporting;
  document.getElementById('pause').disabled=!playing||exporting;
  document.getElementById('restart').disabled=exporting;
  dlBtn.disabled=exporting;
  timeline.disabled=exporting;
  if(exporting) stateEl.textContent='Exporting full video…';
  else if(playing) stateEl.textContent='Playing';
  else stateEl.textContent='Ready';
}

async function ensureAudio(){
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
  if(!audioCtx){
    audioCtx=new AC(); gain=audioCtx.createGain(); gain.gain.value=1; gain.connect(audioCtx.destination);
    dest=audioCtx.createMediaStreamDestination();
    try{voSrc=audioCtx.createMediaElementSource(vo);voSrc.connect(gain);voSrc.connect(dest)}catch(e){}
  }
  if(audioCtx.state==='suspended') await audioCtx.resume();
}
async function play(){
  if(exporting) return;
  await ensureAudio();
  if(t>=DURATION-.05) seek(0);
  playing=true; vo.volume=1;
  try{vo.currentTime=t; await vo.play()}catch(e){stateEl.textContent='Click again for audio'}
  updateBtns();
}
function pause(){if(exporting)return; playing=false;vo.pause();updateBtns()}
function restart(){if(exporting)return; pause();seek(0);renderFrame(0);stateEl.textContent='Ready'}
function pickMime(){for(const m of ['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm']){if(window.MediaRecorder&&MediaRecorder.isTypeSupported(m))return m}return ''}

function finishExport(){
  if(!recorder||recorder.state==='inactive'){ exporting=false; updateBtns(); return; }
  playing=false;
  try{vo.pause()}catch(e){}
  try{recorder.stop()}catch(e){}
}

async function downloadFullVideo(){
  if(exporting) return;
  await ensureAudio();
  pause();
  seek(0);
  renderFrame(0);

  const stream=comp.captureStream(30);
  const tracks=[...stream.getVideoTracks()];
  if(dest) tracks.push(...dest.stream.getAudioTracks());
  const mixed=new MediaStream(tracks);
  const mime=pickMime();
  chunks=[];
  try{
    recorder=mime
      ? new MediaRecorder(mixed,{mimeType:mime,videoBitsPerSecond:8e6})
      : new MediaRecorder(mixed,{videoBitsPerSecond:8e6});
  }catch(e){
    stateEl.textContent='Export failed: '+e.message;
    return;
  }

  recorder.ondataavailable=e=>{if(e.data&&e.data.size) chunks.push(e.data)};
  recorder.onstop=()=>{
    const blob=new Blob(chunks,{type:recorder.mimeType||'video/webm'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download='infinite-express-reel.webm';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    exporting=false;
    updateBtns();
    stateEl.textContent=(blob.size/1e6).toFixed(1)+' MB downloaded';
  };

  exporting=true;
  updateBtns();
  recorder.start(200);
  playing=true;
  vo.volume=1;
  try{
    vo.currentTime=0;
    await vo.play();
  }catch(e){
    stateEl.textContent='Allow audio, then try Download again';
    try{recorder.stop()}catch(err){}
    exporting=false;
    playing=false;
    updateBtns();
    return;
  }
  updateBtns();
}

document.getElementById('play').onclick=()=>play();
document.getElementById('pause').onclick=()=>pause();
document.getElementById('restart').onclick=()=>restart();
dlBtn.onclick=()=>downloadFullVideo();
timeline.addEventListener('pointerdown',()=>{if(exporting)return; scrubbing=true;if(playing)vo.pause()});
timeline.addEventListener('input',()=>{if(exporting)return; scrubbing=true;seek((+timeline.value)/1000);renderFrame(t)});
timeline.addEventListener('pointerup',async()=>{scrubbing=false;if(playing&&!exporting){try{await vo.play()}catch(e){}}});
vo.addEventListener('loadedmetadata',()=>{
  if(vo.duration&&Number.isFinite(vo.duration)){
    DURATION=vo.duration;
    timeline.max=String(Math.round(DURATION*1000));
    durEl.textContent=fmt(DURATION);
    const last=CAM[CAM.length-1]; if(last) last.t=DURATION;
  }
});
vo.addEventListener('ended',()=>{
  t=DURATION;
  if(exporting) finishExport();
  else{ playing=false; updateBtns(); stateEl.textContent='Ended'; }
});

const tip=new Image(); tip.onload=()=>{ticketImg=tip}; tip.src='assets/storyboard/04-ticket.png';
updateBtns(); seek(0); requestAnimationFrame(tick);

/* Frame-accurate export hooks (Playwright / offline render) */
window.__reelExport={
  ready:()=>ticketImg!=null&&vo.readyState>=2&&Number.isFinite(DURATION),
  duration:()=>DURATION,
  renderAt(time){
    pause();
    camSoft=null; camSoftT=-1;
    t=cl(time,0,DURATION);
    renderFrame(t);
    return comp.toDataURL('image/jpeg',0.92);
  }
};
})();
